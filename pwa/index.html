<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- No network at runtime: only files from this folder. Photos stay in memory (blob:). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' blob: data:; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; worker-src 'self'; manifest-src 'self'; media-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>BlisterKompass</title>
<meta name="description" content="Medikationsplan einlesen, Tabletten und Packungen erkennen – alles auf dem Handy, ohne Server.">
<meta name="theme-color" content="#0B6E8A">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BlisterKompass">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div id="app"><main class="screen"><p class="loading">BlisterKompass wird geladen …</p></main></div>
<input type="file" id="camera" accept="image/*" capture="environment" hidden>
<input type="file" id="library" accept="image/*" hidden>
<noscript><p class="loading">BlisterKompass braucht JavaScript.</p></noscript>
</body>
</html>
